name: iconsax
description: Iconsax icon package for Flutter, with support for bold, broken, bulk, linear, outline, and twotone styles as separate getters.
version: 1.0.0

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.0.0'

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

flutter:
  fonts:
    - family: IconsaxBold
      fonts:
        - asset: fonts/iconsax_bold.ttf
    - family: IconsaxBroken
      fonts:
        - asset: fonts/iconsax_broken.ttf
    - family: IconsaxBulk
      fonts:
        - asset: fonts/iconsax_bulk.ttf
    - family: IconsaxLinear
      fonts:
        - asset: fonts/iconsax_linear.ttf
    - family: IconsaxOutline
      fonts:
        - asset: fonts/iconsax_outline.ttf
    - family: IconsaxTwotone
      fonts:
        - asset: fonts/iconsax_twotone.ttf
